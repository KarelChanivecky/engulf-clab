[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-containers-core"
version = "0.3.2"
description = "Core packaged container collection for engulf-clab"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "engulf-api>=1.2,<2",
    "engulf-executable-wrapper-api>=1.2,<2",
    "engulf-clab-schema-api>=2.0.0,<3",
    "engulf-clab-schema>=0.2.0,<1",
    "engulf-clab-containers-api>=1.2.0,<2",
    "engulf-clab-containers>=0.4.2,<1",
    "engulf-docker-image-api>=1.4.0,<2",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"eclab.containers" = "engulf_clab_containers_core:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"eclab.containers" = "engulf_clab_containers_core:plugin"

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_docker_image"]
"eclab.containers.images" = "engulf_clab_containers_core:image_plugin"

[project.entry-points."engulf.plugins.v1.dependency.eclab_containers"]
"engulf_clab.containers" = "preprocess=after; postprocess=none"
"engulf_clab.schema" = "preprocess=after; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_containers_core"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_containers_core/README.md"
"AGENTS.md" = "engulf_clab_containers_core/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_containers_core/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_containers_core/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/build.sh", "/pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/engulf_clab_containers_core"]
