[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-containers-pki"
version = "0.1.1"
description = "PKI-enabled Debian and Fedora base containers for engulf-clab"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-clab-schema-api>=1.0.0,<3",
    "engulf-clab-schema>=0.1.0,<1",
    "engulf-clab-containers-api>=1.0.0,<2",
    "engulf-clab-containers>=0.1.0,<1",
    "engulf-clab-pki>=0.1.0,<1",
    "engulf-clab-pki-linux-debian>=0.1.0,<1",
    "engulf-clab-pki-linux-fedora>=0.1.0,<1",
    "engulf-docker-image-api>=1.0.0,<2",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"eclab.containers.pki" = "engulf_clab_containers_pki:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"eclab.containers.pki" = "engulf_clab_containers_pki:plugin"

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_docker_image"]
"eclab.containers.pki.images" = "engulf_clab_containers_pki:image_plugin"

[project.entry-points."engulf.plugins.v1.dependency.eclab_containers_pki"]
"engulf_clab.containers" = "preprocess=after; postprocess=none"
"engulf_clab.schema" = "preprocess=after; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_containers_pki"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_containers_pki/README.md"
"AGENTS.md" = "engulf_clab_containers_pki/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_containers_pki/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_containers_pki/USAGE.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/USAGE.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_containers_pki"]
