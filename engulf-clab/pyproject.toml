[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab"
version = "0.1.1"
description = "Engulf wrapper for Containerlab (requires Python 3.12+)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf>=0.1,<1",
    "engulf-executable-wrapper>=0.1,<1",
]

[project.scripts]
eclab = "engulf_clab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab"]
