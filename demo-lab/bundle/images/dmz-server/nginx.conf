server {
    listen 443 ssl default_server;
    server_name dmz.demo.test mtls.demo.test;
    include /opt/eclab-pki/state/nginx/identity.conf;
    ssl_client_certificate /mnt/eclab/pki/trust/ca-bundle.pem;
    ssl_verify_client on;

    location / {
        default_type text/plain;
        add_header X-Eclab-Client-Certificate $ssl_client_verify always;
        return 200 "eclab Debian nginx; client certificate: $ssl_client_verify\n";
    }
}
