[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-consumption"
version = "0.1.3"
description = "Report CPU, memory, lab-directory, and Docker image consumption for eclab labs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-clab-schema-api>=1.0.0,<3",
    "engulf-clab-schema>=0.1.0,<1",
    "engulf-clab-lab-parser>=0.1.0,<1",
    "engulf-clab-lab-registry-api>=1.2.0,<2",
    "engulf-clab-lab-registry>=0.1.0,<1",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.consumption" = "engulf_clab_consumption:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.consumption" = "engulf_clab_consumption:plugin"

[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_consumption"]
"engulf_clab.schema" = "preprocess=after; postprocess=none"
"engulf_clab.lab_registry" = "preprocess=before; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_consumption"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_consumption/README.md"
"AGENTS.md" = "engulf_clab_consumption/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_consumption/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_consumption/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_consumption"]
