[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-skill-collector"
version = "0.1.2"
description = "Install and refresh skill directories contributed by engulf-clab plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-clab-skill-api>=0.2,<1",
    "engulf-clab-schema-api>=1.2,<3",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.skill_collector" = "engulf_clab_skill_collector:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.skill_collector" = "engulf_clab_skill_collector:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_skill_collector"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_skill_collector/README.md"
"AGENTS.md" = "engulf_clab_skill_collector/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_skill_collector/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_skill_collector/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_skill_collector"]
