[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-docker-image-core"
version = "1.0.1"
description = "Application-neutral recursive Docker image resolver and build scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-docker-image-api>=1.0.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_docker_image_core"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_docker_image_core/README.md"
"AGENTS.md" = "engulf_docker_image_core/AGENTS.md"
"CONTRIBUTING.md" = "engulf_docker_image_core/CONTRIBUTING.md"
"USAGE.md" = "engulf_docker_image_core/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_docker_image_core"]
