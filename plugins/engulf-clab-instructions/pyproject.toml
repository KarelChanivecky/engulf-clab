[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-instructions"
version = "0.1.0"
description = "Display topology and plugin follow-up instructions after eclab deployment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-clab-instructions-api>=1.0,<2",
    "engulf-clab-lab-parser>=0.2,<1",
    "engulf-clab-lab-writer>=0.2,<1",
    "engulf-clab-schema-api>=1.0,<3",
    "engulf-clab-schema>=0.1,<1",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.instructions" = "engulf_clab_instructions:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.instructions" = "engulf_clab_instructions:plugin"

[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_instructions"]
"engulf_clab.lab_parser" = "preprocess=before; postprocess=none"
"engulf_clab.schema" = "preprocess=after; postprocess=none"
"engulf_clab.lab_writer" = "preprocess=after; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_instructions"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_instructions/README.md"
"AGENTS.md" = "engulf_clab_instructions/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_instructions/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_instructions/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_instructions"]
