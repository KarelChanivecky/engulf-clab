[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-host-exec"
version = "0.1.0"
description = "Shared sudo-aware host command construction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_host_exec"]

[tool.hatch.build.targets.wheel.force-include]
"USAGE.md" = "engulf_host_exec/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/*.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_host_exec"]
