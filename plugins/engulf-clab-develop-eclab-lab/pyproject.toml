[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-develop-eclab-lab"
version = "0.2.1"
description = "Runtime-generated develop-eclab-lab skill for engulf-clab editions"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "engulf-api>=1.2,<2",
    "engulf-executable-wrapper-api>=1.2,<2",
    "engulf-clab-schema-api>=2.0.0,<3",
    "engulf-clab-schema>=0.2.0,<1",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.develop_lab_skill" = "engulf_clab_develop_lab_skill:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.develop_lab_skill" = "engulf_clab_develop_lab_skill:plugin"

[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_develop_lab_skill"]
"engulf_clab.schema" = "preprocess=after; postprocess=before"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_develop_lab_skill"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_develop_lab_skill/README.md"
"AGENTS.md" = "engulf_clab_develop_lab_skill/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_develop_lab_skill/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_develop_lab_skill/USAGE.md"
"skill" = "engulf_clab_develop_lab_skill/skill"

[tool.hatch.build.targets.sdist]
include = ["/src", "/skill", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/build.sh", "/pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/engulf_clab_develop_lab_skill"]
