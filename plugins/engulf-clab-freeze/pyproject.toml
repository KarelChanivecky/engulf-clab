[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-freeze"
version = "0.1.0"
description = "Create and expand portable, sanitized frozen engulf-clab lab archives"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-clab-schema-api>=1.0.0,<3",
    "engulf-clab-schema>=0.1.0,<1",
    "engulf-clab-lab-parser>=0.1.0,<1",
    "engulf-clab-vrnetlab-build>=0.1.0,<1",
    "engulf-clab-freeze-api>=1.0,<2",
    "PyYAML>=6.0",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.freeze" = "engulf_clab_freeze:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.freeze" = "engulf_clab_freeze:plugin"

[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_freeze"]
"engulf_clab.schema" = "preprocess=after; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_freeze"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_freeze/README.md"
"AGENTS.md" = "engulf_clab_freeze/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_freeze/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_freeze/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/pyproject.toml"]
