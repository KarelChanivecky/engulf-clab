[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-ensure-vrnetlab"
version = "0.1.0"
description = "Provision a vrnetlab checkout for engulf-clab build plugins"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-clab-ensure-checkout>=0.1,<0.2",
    "engulf-clab-lab-parser>=0.1.2,<0.2",
    "PyYAML>=6.0",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.ensure_vrnetlab" = "engulf_clab_ensure_vrnetlab:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.ensure_vrnetlab" = "engulf_clab_ensure_vrnetlab:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_ensure_vrnetlab"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/AGENTS.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/engulf_clab_ensure_vrnetlab"]
