format: engulf-clab-demo-coverage
version: 1
topology: lab.clab.yaml

excluded_distributions:
  engulf-clab-wan: real WAN uses the packaged wan-access container
  engulf-clab-ensure-vrnetlab: portable demo has no virtual network appliance
  engulf-clab-vrnetlab-build: portable demo has no proprietary VM image input
  engulf-clab-license-pool: portable demo has no licensed node
  engulf-clab-vrnetlab-fortigate-pki-injector: PKI consumers are ordinary Linux containers
  engulf-clab-develop-eclab-lab: skill installation is not a lab feature
  engulf-clab-develop-eclab-lab-static: comparison skill is not a lab feature

plugins:
  engulf_clab.ensure_containerlab:
    distribution: engulf-clab-ensure-containerlab
    coverage:
      - executable discovery and managed checkout fallback
      - BIN, DIR, repository, update, and version controls documented in RUNBOOK.md
  engulf_clab.lab_parser:
    distribution: engulf-clab-lab-parser
    coverage:
      - explicit topology selection
      - topology-relative paths and source immutability
  engulf_clab.image_archive:
    distribution: engulf-clab-image-archive
    coverage:
      - dmz-archive.env.ECLAB_IMAGE_ARCHIVE
      - dmz-archive.env.ECLAB_IMAGE_ARCHIVE_REF
      - dmz-archive.env.ECLAB_IMAGE_ARCHIVE_RELOAD
  engulf_clab.dockerfile_build:
    distribution: engulf-clab-dockerfile-build
    coverage:
      - ECLAB_DOCKERFILE and ECLAB_DOCKER_CTX
      - ECLAB_DOCKER_VAR_DEMO_RELEASE
      - ECLAB_DOCKER_ARGS
      - ECLAB_DOCKER_BASE_NODE
  eclab.containers:
    distribution: engulf-clab-containers-core
    coverage:
      - ECLAB_CONNECT_HOST and ECLAB_CONNECT_HOST_7 IPv4/IPv6 mappings
      - ECLAB_DHCP_SUBNET, ECLAB_DHCP_GATEWAY, ECLAB_DHCP_POOL_START, and ECLAB_DHCP_POOL_END
      - ECLAB_DHCP_DNS, ECLAB_DHCP_LEASE_TIME, DHCP, and NAT
  engulf_clab.containers:
    distribution: engulf-clab-containers
    coverage:
      - managed recipe selection and latest-tag canonicalization
      - runtime field injection and catalog help
  engulf_clab.image_build:
    distribution: engulf-clab-image-build
    coverage:
      - recursive literal FROM graph
      - external COPY --from installer-image dependencies
      - ECLAB_IMAGE_PARAM_ROLE
      - provider precedence, concurrency, local reuse, pull fallback, and Never policy
  engulf_clab.pki:
    distribution: engulf-clab-pki
    coverage:
      - ECLAB_PKI_MANIFEST and ECLAB_PKI_MOUNT_TARGET controls
      - generated store, reusable profiles, roots, intermediate, and cross-signed variant
      - ECLAB_PKI_CERTIFICATES topology requests and ECLAB_PKI_TRUST_MODE selection
      - ECLAB_PKI_TRUST_INCLUDE node trust selection
      - multiple leaf identities, PEM, DER, PKCS12, SAN, AIA, CRL distribution, and custom extension
      - central CA, certificate database, directory, CRL, OCSP, and administration services
      - global catalog and effective-inspection commands documented in RUNBOOK.md
  engulf_clab.pki_linux_core:
    distribution: engulf-clab-pki-linux-core
    coverage:
      - ECLAB_PKI_REQUIRED startup and ECLAB_PKI_SYSTEM_TRUST augment mode
      - ECLAB_PKI_IDENTITY_CURL and ECLAB_PKI_IDENTITY_NGINX selectors
      - automatic multi-identity NSS import and ECLAB_PKI_BROWSER_CLIENT_CERTS origin policy
      - integration-owned curl configuration, nginx TLS fragment, and direct mTLS
  engulf_clab.pki_linux_debian:
    distribution: engulf-clab-pki-linux-debian
    coverage:
      - Debian 13 client and nginx consumers copy and run the installer asset
      - target applications are installed by the consumers
  engulf_clab.pki_linux_fedora:
    distribution: engulf-clab-pki-linux-fedora
    coverage:
      - Fedora 44 client and nginx consumers copy and run the installer asset
      - runtime detection overrides build-time capability recording
  engulf_clab.freeze:
    distribution: engulf-clab-freeze
    coverage:
      - portable offline freeze and PKI contribution
      - defrost destination and optional encrypted PKI export
  engulf_clab.lab_writer:
    distribution: engulf-clab-lab-writer
    coverage:
      - temporary derived topology and source preservation
  engulf_clab.schema:
    distribution: engulf-clab-schema
    coverage:
      - exact composed schema and runtime fingerprint validation

supporting_contracts:
  engulf-clab-schema-api: schema declarations used by every included plugin
  engulf-clab-freeze-api: PKI freeze and defrost contribution
  engulf-clab-pki-api: typed node projections consumed by Linux integrations
  engulf-clab-ensure-checkout: managed Containerlab checkout behavior
  engulf-docker-image-api: neutral image requirement and provider graph
  engulf-docker-image-core: recursive dependency-first image provisioning
  engulf-clab-containers-api: packaged host-connector and wan-access definitions
