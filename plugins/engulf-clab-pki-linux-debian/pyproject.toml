[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-pki-linux-debian"
version = "0.1.2"
description = "Debian-family eclab PKI integration asset"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["engulf-api>=1.2,<2", "engulf-executable-wrapper-api>=1.2,<2", "engulf-clab-schema-api>=2.0.0,<3", "engulf-clab-schema>=0.2.0,<1", "engulf-docker-image-api>=1.4.0,<2", "engulf-docker-image-core>=1.4.0,<2", "engulf-clab-image-build>=0.2.1,<1", "engulf-clab-pki-linux-core>=0.1.1,<1"]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.pki_linux_debian" = "engulf_clab_pki_linux_debian:plugin"
[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.pki_linux_debian" = "engulf_clab_pki_linux_debian:plugin"
[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_docker_image"]
"engulf_clab.pki_linux_debian.images" = "engulf_clab_pki_linux_debian:image_plugin"
[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_pki_linux_debian"]
"engulf_clab.schema" = "preprocess=after; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_pki_linux_debian"]
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_pki_linux_debian/README.md"
"AGENTS.md" = "engulf_clab_pki_linux_debian/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_pki_linux_debian/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_pki_linux_debian/USAGE.md"
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/pyproject.toml"]
[tool.ruff]
target-version = "py314"
line-length = 100
