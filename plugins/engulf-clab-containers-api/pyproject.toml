[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-containers-api"
version = "1.0.0"
description = "Declarative container collection contract for engulf-clab"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-docker-image-api>=1.0.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_containers_api"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_containers_api"]
