name: eclab-all-features

mgmt:
  network: eclab-demo-mgmt
  ipv4-subnet: 172.31.80.0/24

topology:
  defaults:
    env:
      ECLAB_PKI_MANIFEST: ./pki.yaml
      ECLAB_PKI_MOUNT_TARGET: /mnt/eclab/pki

  nodes:
    segments:
      kind: linux
      image: alpine:3.22
      cmd: sleep infinity

    client-net|segments:
      kind: bridge
      network-mode: container:segments

    dmz-net|segments:
      kind: bridge
      network-mode: container:segments

    router-base-build:
      kind: linux
      image: eclab-demo/router-base:0.1
      env:
        ECLAB_DOCKERFILE: images/router-base/Dockerfile
        ECLAB_DOCKER_CTX: images/router-base
        ECLAB_DOCKER_VAR_DEMO_RELEASE: "0.1"
        ECLAB_DOCKER_ARGS: "--label org.engulf.demo=all-features"
        ECLAB_DOCKER_BASE_NODE: "true"

    router:
      kind: linux
      image: eclab-demo/router:0.1
      cap-add: [NET_ADMIN]
      sysctls:
        net.ipv4.ip_forward: 1
      env:
        ECLAB_DOCKERFILE: images/router/Dockerfile
        ECLAB_DOCKER_CTX: images/router
        ECLAB_IMAGE_PARAM_ROLE: router

    client-a:
      kind: linux
      image: eclab-demo/pki-client-debian:0.1
      env:
        ECLAB_DOCKERFILE: images/pki-client-debian/Dockerfile
        ECLAB_DOCKER_CTX: images/pki-client-debian
        ECLAB_PKI_CERTIFICATES: client-a-mtls,client-a-secondary
        ECLAB_PKI_IDENTITY_CURL: client-a-mtls
        ECLAB_PKI_BROWSER_CLIENT_CERTS: >-
          [{"browser":"chromium","origin":"https://mtls.demo.test:443","identity":"client-a-mtls"}]
        ECLAB_PKI_REQUIRED: "true"
        ECLAB_PKI_SYSTEM_TRUST: augment
      exec:
        - ip address add 10.10.10.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.10.1 dev eth1
        - sh -c "echo '192.0.2.10 mtls.demo.test' >> /etc/hosts"
        - sh -c "echo '192.0.2.10 dmz.demo.test' >> /etc/hosts"
        - sh -c "echo '192.0.2.12 cross.dmz.demo.test' >> /etc/hosts"

    client-b:
      kind: linux
      image: eclab-demo/pki-client-fedora:0.1
      env:
        ECLAB_DOCKERFILE: images/pki-client-fedora/Dockerfile
        ECLAB_DOCKER_CTX: images/pki-client-fedora
        ECLAB_PKI_REQUIRED: "true"
        ECLAB_PKI_SYSTEM_TRUST: augment
        ECLAB_PKI_TRUST_MODE: none
        ECLAB_PKI_TRUST_INCLUDE: demo-root
      exec:
        - ip address add 10.10.10.11/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.10.10.1 dev eth1
        - sh -c "echo '192.0.2.10 mtls.demo.test' >> /etc/hosts"

    dmz-docker:
      kind: linux
      image: eclab-demo/dmz-server:0.1
      env:
        ECLAB_DOCKERFILE: images/dmz-server/Dockerfile
        ECLAB_DOCKER_CTX: images/dmz-server
        ECLAB_PKI_CERTIFICATES: dmz-nginx-primary
        ECLAB_PKI_IDENTITY_NGINX: dmz-nginx-primary
        ECLAB_PKI_REQUIRED: "true"
      exec:
        - ip address add 192.0.2.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.0.2.1 dev eth1

    dmz-fedora:
      kind: linux
      image: eclab-demo/dmz-fedora:0.1
      env:
        ECLAB_DOCKERFILE: images/dmz-fedora/Dockerfile
        ECLAB_DOCKER_CTX: images/dmz-fedora
        ECLAB_PKI_CERTIFICATES: dmz-nginx-cross-signed
        ECLAB_PKI_IDENTITY_NGINX: dmz-nginx-cross-signed
        ECLAB_PKI_REQUIRED: "true"
      exec:
        - ip address add 192.0.2.12/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.0.2.1 dev eth1

    archive-source-build:
      kind: linux
      image: eclab-demo/archive-source:0.1
      env:
        ECLAB_DOCKERFILE: images/archive-source/Dockerfile
        ECLAB_DOCKER_CTX: images/archive-source
        ECLAB_DOCKER_BASE_NODE: "true"

    dmz-archive:
      kind: linux
      image: eclab-demo/archive-server:0.1
      env:
        ECLAB_IMAGE_ARCHIVE: artifacts/archive-source.tar.gz
        ECLAB_IMAGE_ARCHIVE_REF: eclab-demo/archive-source:0.1
        ECLAB_IMAGE_ARCHIVE_RELOAD: "true"
      exec:
        - ip address add 192.0.2.11/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.0.2.1 dev eth1

    host-connector:
      kind: linux
      image: eclab.containers/host-connector
      env:
        ECLAB_CONNECT_HOST: "192.0.2.200;192.0.2.201"
        ECLAB_CONNECT_HOST_7: "2001:db8:2::200;2001:db8:2::201"

    real-wan:
      kind: linux
      image: eclab.containers/wan-access
      env:
        ECLAB_DHCP_SUBNET: 198.18.0.0/24
        ECLAB_DHCP_GATEWAY: 198.18.0.1
        ECLAB_DHCP_POOL_START: 198.18.0.100
        ECLAB_DHCP_POOL_END: 198.18.0.200
        ECLAB_DHCP_DNS: 1.1.1.1
        ECLAB_DHCP_LEASE_TIME: "43200"

  links:
    - endpoints: ["client-a:eth1", "client-net|segments:client-a"]
    - endpoints: ["client-b:eth1", "client-net|segments:client-b"]
    - endpoints: ["router:eth1", "client-net|segments:router-client"]
    - endpoints: ["router:eth2", "dmz-net|segments:router-dmz"]
    - endpoints: ["dmz-docker:eth1", "dmz-net|segments:dmz-docker"]
    - endpoints: ["dmz-fedora:eth1", "dmz-net|segments:dmz-fedora"]
    - endpoints: ["dmz-archive:eth1", "dmz-net|segments:dmz-archive"]
    - endpoints: ["host-connector:eth1", "dmz-net|segments:host-connector"]
    - endpoints: ["router:eth3", "real-wan:eth1"]
