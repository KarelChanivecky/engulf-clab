[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-wan"
version = "0.3.2"
description = "Edition-aware managed WAN bridges for engulf-clab"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "engulf-api>=1.2,<2",
    "engulf-executable-wrapper-api>=1.2,<2",
    "engulf-clab-schema-api>=2.0.0,<3",
    "engulf-clab-schema>=0.2.0,<1",
    "engulf-clab-lab-parser>=0.2.2,<1",
    "engulf-clab-lab-writer>=0.2.2,<1",
    "PyYAML>=6.0",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.wan" = "engulf_clab_wan:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.wan" = "engulf_clab_wan:plugin"

[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_wan"]
"engulf_clab.lab_parser" = "preprocess=before; postprocess=none"
"engulf_clab.lab_writer" = "preprocess=after; postprocess=none"
"engulf_clab.schema" = "preprocess=after; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_wan"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_wan/README.md"
"AGENTS.md" = "engulf_clab_wan/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_wan/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_wan/USAGE.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/USAGE.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/engulf_clab_wan"]
