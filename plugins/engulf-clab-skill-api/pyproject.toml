[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-skill-api"
version = "0.2.1"
description = "Path-based skill contribution contract for engulf-clab plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["engulf-api>=1.0,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_skill_api"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_skill_api/README.md"
"AGENTS.md" = "engulf_clab_skill_api/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_skill_api/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_skill_api/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_skill_api"]
