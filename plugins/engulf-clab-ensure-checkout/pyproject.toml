[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-ensure-checkout"
version = "0.1.0"
description = "Shared managed-checkout support for engulf-clab plugins"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["engulf-api>=1.0,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_ensure_checkout"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/engulf_clab_ensure_checkout"]
