[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-vrnetlab-fortigate-pki-injector"
version = "0.2.0"
description = "Inject engulf-clab PKI paths into vrnetlab FortiGate nodes"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "engulf-api>=1.2,<2",
    "engulf-executable-wrapper-api>=1.2,<2",
    "engulf-clab-schema-api>=2.0.0,<3",
    "engulf-clab-schema>=0.2.0,<0.3",
    "engulf-clab-pki-api>=2,<3",
    "engulf-clab-pki>=0.3.0,<0.4",
    "engulf-clab-lab-parser>=0.2.0,<0.3",
    "engulf-clab-lab-writer>=0.2.0,<0.3",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.vrnetlab_fortigate_pki_injector" = "engulf_clab_vrnetlab_fortigate_pki_injector:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.vrnetlab_fortigate_pki_injector" = "engulf_clab_vrnetlab_fortigate_pki_injector:plugin"

[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_vrnetlab_fortigate_pki_injector"]
"engulf_clab.lab_parser" = "preprocess=before; postprocess=none"
"engulf_clab.pki" = "preprocess=before; postprocess=none"
"engulf_clab.lab_writer" = "preprocess=after; postprocess=none"
"engulf_clab.schema" = "preprocess=after; postprocess=none"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_vrnetlab_fortigate_pki_injector"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_vrnetlab_fortigate_pki_injector/README.md"
"AGENTS.md" = "engulf_clab_vrnetlab_fortigate_pki_injector/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_vrnetlab_fortigate_pki_injector/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_vrnetlab_fortigate_pki_injector/USAGE.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/AGENTS.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/USAGE.md", "/build.sh", "/pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/engulf_clab_vrnetlab_fortigate_pki_injector"]
