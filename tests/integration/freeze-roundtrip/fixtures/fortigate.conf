config system interface
    edit port3
        set mode dhcp
        set defaultgw enable
        set allowaccess ping
    next
    edit port2
        set mode static
        set ip 198.18.77.1 255.255.255.0
        set allowaccess ping https ssh
    next
end
config system global
    set admin-server-cert server
    set admin-sport 443
end
