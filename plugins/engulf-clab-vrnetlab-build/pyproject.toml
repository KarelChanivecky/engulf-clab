[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-vrnetlab-build"
version = "0.2.1"
description = "Build node images with vrnetlab before engulf-clab deploys"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "engulf-api>=1.0,<2",
    "engulf-executable-wrapper-api>=1.0,<2",
    "engulf-clab-schema-api>=1.2,<2",
    "engulf-clab-schema>=0.1,<0.2",
    "engulf-clab-ensure-vrnetlab>=0.1,<0.2",
    "engulf-clab-lab-parser>=0.1.2,<0.2",
    "engulf-docker-image-api>=1.1,<2",
    "PyYAML>=6.0",
]

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.vrnetlab_build" = "engulf_clab_vrnetlab_build:plugin"

[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.vrnetlab_build" = "engulf_clab_vrnetlab_build:plugin"

[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_docker_image"]
"org.engulf.docker.vrnetlab-build" = "engulf_clab_vrnetlab_build:image_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_vrnetlab_build"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_vrnetlab_build/README.md"
"AGENTS.md" = "engulf_clab_vrnetlab_build/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_vrnetlab_build/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_vrnetlab_build/USAGE.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/USAGE.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/engulf_clab_vrnetlab_build"]
