[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-demo-lab"
version = "0.1.2"
description = "Installer for the portable eclab demonstration lab"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-clab>=0.1.0,<1",
    "engulf-clab-schema-api>=1.0.0,<3",
    "engulf-clab-schema>=0.1.0,<1",
    "engulf-clab-freeze-api>=1.0,<2",
    "engulf-clab-pki-api>=1.0,<3",
    "engulf-docker-image-api>=1.0.0,<2",
    "engulf-docker-image-core>=1.0.0,<2",
    "engulf-clab-containers-api>=1.0.0,<2",
    "engulf-clab-lab-parser>=0.1.0,<1",
    "engulf-clab-lab-writer>=0.1.0,<1",
    "engulf-clab-ensure-checkout>=0.1.0,<1",
    "engulf-clab-ensure-containerlab>=0.1.0,<1",
    "engulf-clab-image-build>=0.1.0,<1",
    "engulf-clab-dockerfile-build>=0.1.0,<1",
    "engulf-clab-image-archive>=0.1.0,<1",
    "engulf-clab-containers>=0.1.0,<1",
    "engulf-clab-containers-core>=0.1.0,<1",
    "engulf-clab-containers-pki>=0.1.0,<1",
    "engulf-clab-freeze>=0.1.0,<1",
    "engulf-clab-pki>=0.1.0,<1",
    "engulf-clab-pki-linux-core>=0.1.0,<1",
    "engulf-clab-pki-linux-debian>=0.1.0,<1",
    "engulf-clab-pki-linux-fedora>=0.1.0,<1",
]

[project.scripts]
eclab-demo-lab-install = "engulf_clab_demo_lab.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_demo_lab"]

[tool.hatch.build.targets.wheel.force-include]
"bundle" = "engulf_clab_demo_lab/bundle"
"README.md" = "engulf_clab_demo_lab/README.md"
"USAGE.md" = "engulf_clab_demo_lab/USAGE.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/bundle",
    "/tests",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/USAGE.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_demo_lab"]
