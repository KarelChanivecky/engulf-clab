# Dante SOCKS5 server defaults for eclab/proxy-node.
#
# `external` must be the proxy node's data-plane IP, not an interface name.
# The baked-in placeholder below is documentation-only; every consuming lab
# MUST bind-mount a lab-specific sockd.conf whose `external` matches the IP
# the lab's exec steps assign to the data-plane interface (and set the same
# address in SOCKS_EXTERNAL_IP so the entrypoint waits for it).

logoutput: /var/log/sockd.log
internal: 0.0.0.0 port = 1080
external: 192.0.2.10
socksmethod: none
clientmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect disconnect error
}
