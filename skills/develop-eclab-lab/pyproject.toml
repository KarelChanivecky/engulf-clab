[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "develop-eclab-lab"
version = "0.1.0"
description = "Self-contained Codex skill for building and troubleshooting eclab labs"
readme = { text = "Installs the self-contained develop-eclab-lab Codex skill and its bundled Engulf/ECLAB references.", content-type = "text/markdown" }
requires-python = ">=3.14"
license = "MIT"

[project.scripts]
develop-eclab-lab-install = "develop_eclab_lab_skill.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/develop_eclab_lab_skill"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "develop_eclab_lab_skill/bundle/SKILL.md"
"agents" = "develop_eclab_lab_skill/bundle/agents"
"references" = "develop_eclab_lab_skill/bundle/references"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/SKILL.md",
    "/agents",
    "/pyproject.toml",
    "/references",
    "/src",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/develop_eclab_lab_skill"]
