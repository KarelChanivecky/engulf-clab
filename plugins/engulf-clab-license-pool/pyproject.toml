[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[project]
name = "engulf-clab-license-pool"
version = "0.3.2"
description = "Shared license-pool allocation for engulf-clab labs"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["engulf-api>=1.2,<2", "engulf-executable-wrapper-api>=1.2,<2", "engulf-clab-schema-api>=2.0.0,<3", "engulf-clab-schema>=0.2.0,<1", "engulf-clab-lab-parser>=0.2.2,<1", "engulf-clab-lab-writer>=0.2.2,<1"]
[project.entry-points."engulf.plugins.v1.goal.v1.org_engulf_executable_wrapper"]
"engulf_clab.license_pool" = "engulf_clab_license_pool:plugin"
[project.entry-points."engulf.plugins.v1.application.engulf_clab"]
"engulf_clab.license_pool" = "engulf_clab_license_pool:plugin"
[project.entry-points."engulf.plugins.v1.dependency.engulf_clab_license_pool"]
"engulf_clab.lab_parser" = "preprocess=before; postprocess=none"
"engulf_clab.lab_writer" = "preprocess=after; postprocess=none"
"engulf_clab.schema" = "preprocess=after; postprocess=none"
[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_license_pool"]
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "engulf_clab_license_pool/README.md"
"AGENTS.md" = "engulf_clab_license_pool/AGENTS.md"
"CONTRIBUTING.md" = "engulf_clab_license_pool/CONTRIBUTING.md"
"USAGE.md" = "engulf_clab_license_pool/USAGE.md"
