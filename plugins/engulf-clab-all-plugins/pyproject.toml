[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-all-plugins"
version = "0.1.7"
description = "Meta-package that installs all engulf-clab plugins (requires Python 3.12+)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "engulf-clab-schema-api>=1.0.0,<2",
    "engulf-clab-schema>=0.1.0,<1",
    "engulf-clab-develop-eclab-lab>=0.1.0,<1",
    "engulf-docker-image-api>=1.0.0,<2",
    "engulf-docker-image-core>=1.0.0,<2",
    "engulf-clab-image-build>=0.1.0,<1",
    "engulf-clab-image-archive>=0.2.0,<1",
    "engulf-clab-containers-api>=1.0.0,<2",
    "engulf-clab-containers>=0.1.0,<1",
    "engulf-clab-containers-core>=0.1.0,<1",
    "engulf-clab-containers-pki>=0.1.0,<1",
    "engulf-clab-license-pool-lib>=2.0,<3",
    "engulf-clab-license-pool>=0.1.5,<1",
    "engulf-clab-freeze>=0.2.0,<1",
    "engulf-clab-lab-registry-api>=1.2.0,<2",
    "engulf-clab-lab-registry>=0.1.0,<1",
    "engulf-clab-reclaim>=0.1.0,<1",
    "engulf-clab-consumption>=0.1.0,<1",
    "engulf-clab-freeze-api>=1.1,<2",
    "engulf-clab-pki-api>=1.0,<3",
    "engulf-clab-pki>=0.1.0,<1",
    "engulf-clab-pki-linux-core>=0.1.0,<1",
    "engulf-clab-pki-linux-debian>=0.1.0,<1",
    "engulf-clab-pki-linux-fedora>=0.1.0,<1",
    "engulf-clab-vrnetlab-fortigate-pki-injector>=0.1.1,<1",
    "engulf-clab-lab-parser>=0.1.0,<1",
    "engulf-clab-lab-writer>=0.1.0,<1",
    "engulf-clab-sticky-ip>=0.1.0,<1",
    "engulf-clab-dockerfile-build>=0.1.2,<1",
    "engulf-clab-ensure-containerlab>=0.1.0,<1",
    "engulf-clab-ensure-vrnetlab>=0.1.0,<1",
    "engulf-clab-vrnetlab-build>=0.1.4,<1",
    "engulf-clab-wan>=0.1.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engulf_clab_all_plugins"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/AGENTS.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/engulf_clab_all_plugins"]
