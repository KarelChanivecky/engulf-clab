[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engulf-clab-develop-eclab-lab"
version = "0.1.1"
description = "Self-contained Codex skill for building and troubleshooting eclab labs"
readme = { text = """
# develop-eclab-lab

Self-contained Codex skill for building, validating, operating, freezing, and
troubleshooting Containerlab labs through base eclab, an eclab edition, a local
CLI, or the privileged local MCP service.

The wheel embeds `SKILL.md`, Codex interface metadata, and normalized snapshots
of the Engulf API/runtime, executable-wrapper contracts, eclab wrapper/MCP
guides, every maintained plugin guide, and packaged-container documentation. An
installed skill does not require either source repository.

```bash
python3.14 -m pip install engulf-clab-develop-eclab-lab
develop-eclab-lab-install
develop-eclab-lab-install --check
```

The default target is `$CODEX_HOME/skills/develop-eclab-lab`, falling back to
`~/.codex/skills/develop-eclab-lab` when `CODEX_HOME` is unset. Override its
parent with `--skills-dir` or `DEVELOP_ECLAB_LAB_SKILLS_DIR`; override safe
backup storage with `--backup-dir` or `DEVELOP_ECLAB_LAB_BACKUP_DIR`. The
installer publishes atomically, backs up recognized older installations, and
refuses to replace an unrelated path.
""", content-type = "text/markdown" }
requires-python = ">=3.14"
license = "MIT"

[project.scripts]
develop-eclab-lab-install = "develop_eclab_lab_skill.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/develop_eclab_lab_skill"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "develop_eclab_lab_skill/bundle/SKILL.md"
"agents" = "develop_eclab_lab_skill/bundle/agents"
"references" = "develop_eclab_lab_skill/bundle/references"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/SKILL.md",
    "/agents",
    "/pyproject.toml",
    "/references",
    "/src",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/develop_eclab_lab_skill"]
